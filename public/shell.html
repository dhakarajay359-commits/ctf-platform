<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OmniCorp Remote Shell</title>
  <link rel="stylesheet" href="/node_modules/xterm/css/xterm.css" />
  <script src="/node_modules/xterm/lib/xterm.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #terminal-container { width: 100%; height: 100%; padding: 10px; box-sizing: border-box; }
    .topbar { background: #111; color: #fff; font-family: monospace; padding: 5px 10px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
    .close-btn { color: #f33; cursor: pointer; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="topbar">
    <span>>_ OMNICORP SECURE SHELL SESSION</span>
    <a href="javascript:window.close();" class="close-btn">EXIT</a>
  </div>
  <div id="terminal-container"></div>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      theme: { background: '#0a0e14', foreground: '#00ff66' }
    });
    term.open(document.getElementById('terminal-container'));

    const socket = io();
    
    socket.emit('terminal:start');

    term.onData(data => {
      socket.emit('terminal:data', data);
    });

    socket.on('terminal:data', function(data) {
      term.write(data);
    });
    
    socket.on('disconnect', () => {
      term.write('\r\n\x1b[31m[CONNECTION LOST]\x1b[0m\r\n');
    });
  </script>
</body>
</html>
